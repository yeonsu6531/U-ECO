<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지도 | Green Campus Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="map-page">

  <header class="topbar">
    <a href="index.html" class="back-link">← 처음으로</a>
    <h1>울산대학교 캠퍼스 지도</h1>
    <button id="coordModeBtn" class="coord-toggle" type="button">좌표 찾기 모드</button>
  </header>

  <div class="map-layout">
    <aside class="legend-panel">
      <h2>아이콘 안내</h2>
      <ul>
        <li>
          <img src="assets/icons/info.png" alt="" />
          <div>
            <p class="legend-title">정보</p>
            <p class="legend-desc">울산대학교 분리수거 및 쓰레기통 위치 상세 정보</p>
          </div>
        </li>
        <li>
          <img src="assets/icons/recycle.png" alt="" />
          <div>
            <p class="legend-title">재활용</p>
            <p class="legend-desc">분리수거 및 쓰레기통 위치</p>
          </div>
        </li>
        <li>
          <img src="assets/icons/anabada.png" alt="" />
          <div>
            <p class="legend-title">아나바다</p>
            <p class="legend-desc">아나바다 행사장 위치</p>
          </div>
        </li>
      </ul>
    </aside>

    <div class="map-wrap" id="mapWrap">
      <div id="leafletMap" class="leaflet-map-box"></div>
    </div>
  </div>

  <p class="coord-readout" id="coordReadout"></p>

  <!-- 건물 클릭 시 뜨는 팝업 -->
  <div id="buildingModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" type="button">닫기</button>
      <p class="modal-number" id="modalNumber"></p>
      <h2 id="modalName"></h2>

      <div id="trashSection" class="trash-section hidden">
        <button class="info-btn" id="infoBtn" type="button">
          <img src="assets/icons/info.png" alt="" />
          쓰레기통 위치 보기
        </button>
        <p class="trash-detail hidden" id="trashDetail"></p>
      </div>
    </div>
  </div>

  <!-- 아나바다 등 특수 지점 클릭 시 뜨는 간단 팝업 -->
  <div id="spotModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="spotModalClose" type="button">닫기</button>
      <h2 id="spotName"></h2>
      <p id="spotDesc"></p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>지도 | Green Campus Map</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="map-page">

  <header class="topbar">
    <a href="index.html" class="back-link">← 처음으로</a>
    <h1>울산대학교 캠퍼스 지도</h1>
    <button id="coordModeBtn" class="coord-toggle" type="button">좌표 찾기 모드</button>
  </header>

  <div class="map-wrap" id="mapWrap">
    <img id="campusImg" class="campus-img" src="assets/campus-map.jpg" alt="울산대학교 캠퍼스 지도"
         onerror="this.classList.add('img-missing')" />
    <div class="img-missing-note">
      <p><strong>campus-map.jpg</strong>가 아직 없어요.</p>
      <p>assets 폴더에 울산대학교 지도 이미지를 <code>campus-map.jpg</code> 라는 이름으로 넣어주세요.</p>
    </div>

    <!-- 건물 / 특수 지점 핀은 script.js가 data.js를 읽어서 여기 자동으로 그립니다 -->
    <div id="pinLayer" class="pin-layer"></div>
  </div>

  <p class="coord-readout" id="coordReadout"></p>

  <!-- 건물 클릭 시 뜨는 팝업 -->
  <div id="buildingModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" type="button">닫기</button>
      <p class="modal-number" id="modalNumber"></p>
      <h2 id="modalName"></h2>

      <div id="trashSection" class="trash-section hidden">
        <button class="info-btn" id="infoBtn" type="button">
          <img src="assets/icons/info.png" alt="" />
          쓰레기통 위치 보기
        </button>
        <p class="trash-detail hidden" id="trashDetail"></p>
      </div>
    </div>
  </div>

  <!-- 아나바다 등 특수 지점 클릭 시 뜨는 간단 팝업 -->
  <div id="spotModal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" id="spotModalClose" type="button">닫기</button>
      <h2 id="spotName"></h2>
      <p id="spotDesc"></p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
